openapi: 3.0.1
info:
  description: |
    Better Metadata - Better Science

    The OpenView server hands out CEDAR content that has been marked open, to anyone, without
    credentials. It is what makes a published artifact citable: the artifact IRI resolves here for a
    reader who has no CEDAR account.

    An artifact or folder is served when it is open itself, or when a folder above it is. Anything
    else is refused, and nothing here writes.
  title: CEDAR OpenView Server API
  version: 2.9.12
paths:
  /:
    get:
      operationId: showInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The service name and links to its API documentation
      summary: Describe this CEDAR service
      tags:
      - Service
  /folders/{id}:
    get:
      description: "Return an anonymous public projection of what an open folder holds.\
        \ Opening a folder makes its whole descendant subtree readable through OpenView.\
        \ The breadcrumb contains ancestor names only; child summaries contain only\
        \ their identifier, type, and name. No ACL, provenance, timestamp, DOI, or\
        \ caller-specific permission fields are returned."
      operationId: findFolder
      parameters:
      - description: Folder identifier.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: "Comma-separated artifact types to include, in place of all of\
          \ them."
        in: query
        name: resource_types
        schema:
          type: string
      - description: "Which versions to include: `latest`, `latest-published`, `latest-draft`,\
          \ or `all`."
        in: query
        name: version
        schema:
          type: string
      - description: "Filter by publication status: `draft` or `published`."
        in: query
        name: publication_status
        schema:
          type: string
      - description: Comma-separated sort fields; a leading `-` reverses one.
        in: query
        name: sort
        schema:
          type: string
      - description: Maximum number of entries to return.
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      - description: Number of entries to skip before the first one returned.
        in: query
        name: offset
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenViewFolderResponse"
          description: The folder's contents and its path
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "A paging, sort, or filter parameter is not valid"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The folder exists but is not open, and neither is any folder\
            \ above it"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such folder
      summary: List the contents of an open folder
      tags:
      - Folders
  /healthcheck:
    get:
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Every health check passed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: object
          description: At least one health check failed
      security:
      - api_key: []
      summary: Run this service's health checks
      tags:
      - Service diagnostics
  /insight/full:
    get:
      operationId: full
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report all JVM diagnostics except per-thread stack traces
      tags:
      - Service diagnostics
  /insight/gc:
    get:
      operationId: gc
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM garbage-collection counts
      tags:
      - Service diagnostics
  /insight/memory:
    get:
      operationId: memory
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM memory use
      tags:
      - Service diagnostics
  /insight/system:
    get:
      operationId: system
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report operating-system information
      tags:
      - Service diagnostics
  /insight/thread-details:
    get:
      operationId: threadDetails
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report details and stack traces for every JVM thread
      tags:
      - Service diagnostics
  /insight/threads:
    get:
      operationId: threads
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM thread counts
      tags:
      - Service diagnostics
  /template-elements/{id}:
    get:
      description: "Return a template element that is open to everyone. An artifact\
        \ is served when it is marked open, or when it sits under a folder that is.\
        \ No credentials are involved: this server exists to hand out open artifacts\
        \ anonymously, which is what makes a published CEDAR artifact citable. Artifact\
        \ storage's internal `_id` is removed before the artifact is returned."
      operationId: findTemplateElement
      parameters:
      - description: Artifact identifier. Either the bare identifier or the full IRI
          is accepted; a bare one is resolved to the IRI before lookup.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
          description: The template element
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The template element exists but is not open, and neither is\
            \ any folder above it"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such template element
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A required backend is unavailable
      summary: Get an open template element
      tags:
      - Template elements
  /template-fields/{id}:
    get:
      description: "Return a template field that is open to everyone. An artifact\
        \ is served when it is marked open, or when it sits under a folder that is.\
        \ No credentials are involved: this server exists to hand out open artifacts\
        \ anonymously, which is what makes a published CEDAR artifact citable. Artifact\
        \ storage's internal `_id` is removed before the artifact is returned."
      operationId: findTemplateField
      parameters:
      - description: Artifact identifier. Either the bare identifier or the full IRI
          is accepted; a bare one is resolved to the IRI before lookup.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
          description: The template field
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The template field exists but is not open, and neither is\
            \ any folder above it"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such template field
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A required backend is unavailable
      summary: Get an open template field
      tags:
      - Template fields
  /template-instances/{id}:
    get:
      description: "Return a template instance that is open to everyone. An artifact\
        \ is served when it is marked open, or when it sits under a folder that is.\
        \ No credentials are involved: this server exists to hand out open artifacts\
        \ anonymously, which is what makes a published CEDAR artifact citable. Artifact\
        \ storage's internal `_id` is removed before the artifact is returned."
      operationId: findTemplateInstance
      parameters:
      - description: Artifact identifier. Either the bare identifier or the full IRI
          is accepted; a bare one is resolved to the IRI before lookup.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceArtifactDocument"
          description: The template instance
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The template instance exists but is not open, and neither\
            \ is any folder above it"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such template instance
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A required backend is unavailable
      summary: Get an open template instance
      tags:
      - Template instances
  /templates/{id}:
    get:
      description: "Return a template that is open to everyone. An artifact is served\
        \ when it is marked open, or when it sits under a folder that is. No credentials\
        \ are involved: this server exists to hand out open artifacts anonymously,\
        \ which is what makes a published CEDAR artifact citable. Artifact storage's\
        \ internal `_id` is removed before the artifact is returned."
      operationId: findTemplate
      parameters:
      - description: Artifact identifier. Either the bare identifier or the full IRI
          is accepted; a bare one is resolved to the IRI before lookup.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaArtifactDocument"
          description: The template
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The template exists but is not open, and neither is any folder\
            \ above it"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such template
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A required backend is unavailable
      summary: Get an open template
      tags:
      - Templates
components:
  schemas:
    CedarError:
      type: object
      additionalProperties: false
      description: A CEDAR error response. Diagnostic fields are populated only when
        they are relevant to the failure.
      properties:
        entities:
          type: object
          additionalProperties:
            type: object
            description: Named domain entities associated with exception-mapped errors.
            nullable: true
          description: Named domain entities associated with exception-mapped errors.
          nullable: true
        errorId:
          type: string
          format: uuid
          description: Correlation identifier for an internal error recorded in server
            logs.
          nullable: true
        errorKey:
          type: string
          description: Stable machine-readable error identifier.
          enum:
          - templateElementNotCreated
          - templateElementNotFound
          - templateElementNotDeleted
          - templateElementNotUpdated
          - templateElementsNotListed
          - templateFieldNotCreated
          - templateFieldNotFound
          - templateFieldNotDeleted
          - templateFieldNotUpdated
          - templateFieldsNotListed
          - templateNotCreated
          - templateNotFound
          - templateNotDeleted
          - templateNotUpdated
          - templatesNotListed
          - templateInstanceNotCreated
          - templateInstanceNotFound
          - templateInstanceNotDeleted
          - templateInstanceNotUpdated
          - templateInstancesNotListed
          - noReadAccessToResource
          - noWriteAccessToResource
          - noReadAccessToFolder
          - noWriteAccessToFolder
          - noReadAccessToTemplate
          - noWriteAccessToTemplate
          - noReadAccessToTemplateElement
          - noWriteAccessToTemplateElement
          - noReadAccessToTemplateField
          - noWriteAccessToTemplateField
          - noReadAccessToTemplateInstance
          - noWriteAccessToTemplateInstance
          - noReadAccessToArtifact
          - noWriteAccessToArtifact
          - noReadAccessToCategory
          - noWriteAccessToCategory
          - folderNotFound
          - artifactNotFound
          - artifactPreconditionRequired
          - artifactHasMovedOn
          - verbatimWriteRefused
          - nodeNotFound
          - unknownResourceType
          - missingParameter
          - invalidInput
          - sourceFolderNotFound
          - sourceResourceNotFound
          - targetFolderNotFound
          - nodeNotMoved
          - groupNotFound
          - userNotFound
          - uniqueConstraintCollision
          - invalidData
          - notAuthorized
          - permissionMissing
          - tokenInvalid
          - userInfoLoadByTokenFailed
          - userInfoLoadByApiKeyFailed
          - cedarUserNotFound
          - authorizationNotFound
          - permissionNotOwned
          - authorizationTypeUnknown
          - apiKeyNotFound
          - tokenMissing
          - tokenExpired
          - parentFolderNotSpecified
          - parentFolderSpecifiedTwice
          - pathNotNormalized
          - parentFolderNotFound
          - updateInvalidFolderName
          - createInvalidFolderName
          - nodeAlreadyPresent
          - folderNotCreated
          - missingNameAndDescription
          - missingData
          - folderNotDeleted
          - artifactNotDeleted
          - resourceNotCreated
          - invalidResourceType
          - invalidArtifactType
          - readOtherProfileForbidden
          - updateOtherProfileForbidden
          - folderCanNotBeDeleted
          - folderCanNotBeChanged
          - groupAlreadyPresent
          - groupCanBeModifiedOnlyByGroupAdmin
          - groupCanBeDeletedOnlyByGroupAdmin
          - groupMembersCanBeReadOnlyByGroupAdmin
          - groupRequiresAdministrator
          - groupUsersNotUpdated
          - specialGroupCanNotBeDeleted
          - folderPermissionsCanNotBeChanged
          - unknownInstanceOutputFormat
          - folderCopyNotAllowed
          - methodNotImplemented
          - upstreamServerError
          - nothingToDo
          - parentCategoryNotFound
          - categoryAlreadyPresent
          - categoryNotFound
          - categoryCanNotBeDeleted
          - rootCategoryCanNotBeDeleted
          - unableToAttachCategory
          - unableToDetachCategory
          - noCategoriesWereAttached
          - malformedJsonRequestBody
          - malformedSearchTerm
          - publishedArtifactCanNotBeChanged
          - publishedArtifactCanNotBeDeleted
          - versioningOnlyOnLatest
          - versioningOnlyByOwner
          - nonVersionedArtifactType
          - createDraftOnlyFromPublished
          - publishOnlyDraft
          - draftNotCreated
          - contentNotValid
          - doiNotSupportedByResourceType
          - doiCanNotBeSetForEmptyAtId
          - doiCanNotBeAltered
          - doiCanNotBeSet
          - doiAlreadyExists
          - dataCiteDOIDisabled
          - pinnedVersionUnavailable
          - resourceNotFound
          - internalError
          nullable: true
        errorReasonKey:
          type: string
          description: More specific machine-readable reason for the error.
          enum:
          - nonEmptyFolder
          - nonEmptyCategory
          - userHomeFolder
          - systemFolder
          - templateReferencedInInstances
          - validationError
          - continuationExpired
          nullable: true
        errorType:
          type: string
          description: Broad category of the error.
          enum:
          - notFound
          - invalidArgument
          - authorization
          - permission
          - server
          - validationError
          nullable: true
        message:
          type: string
          description: Human-readable error message.
          nullable: true
        objects:
          type: object
          additionalProperties:
            type: object
            description: Named structured values associated with the error.
          description: Named structured values associated with the error.
        operation:
          type: object
          description: Operation that failed. Its fields depend on the operation type.
          nullable: true
        parameters:
          type: object
          additionalProperties:
            type: object
            description: Named scalar values associated with the error.
          description: Named scalar values associated with the error.
        status:
          type: string
          description: Symbolic HTTP response status.
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - NOT_ACCEPTABLE
          - CONFLICT
          - PRECONDITION_FAILED
          - UNSUPPORTED_MEDIA_TYPE
          - UNPROCESSABLE_ENTITY
          - PRECONDITION_REQUIRED
          - INTERNAL_SERVER_ERROR
          - NOT_IMPLEMENTED
          - BAD_GATEWAY
          - SERVICE_UNAVAILABLE
          - HTTP_VERSION_NOT_SUPPORTED
        statusCode:
          type: integer
          format: int32
          description: Numeric HTTP response status.
          maximum: 599
          minimum: 400
        suggestedAction:
          type: string
          description: Recovery action suggested to the client.
          enum:
          - none
          - requestRole
          - logout
          - logoutImmediately
          - provideAuthorizationHeader
          - refreshToken
          nullable: true
      required:
      - status
      - statusCode
    InstanceArtifactDocument:
      type: object
      additionalProperties: true
      description: "A template instance. Its value keys are the names of the template's\
        \ fields and elements, so the only fixed key beyond the common artifact keys\
        \ is the template it is based on."
      properties:
        '@context':
          type: object
          additionalProperties: true
          description: JSON-LD context for the keys the artifact uses.
        '@id':
          type: string
          format: uri
          description: "The artifact's IRI. The server mints it on a POST, so a body\
            \ sent to POST carries none; a body sent to PUT carries the IRI of the\
            \ path."
        oslc:modifiedBy:
          type: string
          format: uri
          description: IRI of the user who last changed it.
        pav:createdBy:
          type: string
          format: uri
          description: IRI of the user who created it.
        pav:createdOn:
          type: string
          format: date-time
          description: When the artifact was created.
        pav:lastUpdatedOn:
          type: string
          format: date-time
          description: When the artifact was last changed.
        schema:description:
          type: string
          description: Description shown with the name.
        schema:isBasedOn:
          type: string
          format: uri
          description: IRI of the template the instance was filled in against.
        schema:name:
          type: string
          description: Display name.
    NodeListRequest:
      type: object
      additionalProperties: false
      description: The normalized search and paging criteria used for this response.
      properties:
        categoryId:
          type: string
          format: uri
          nullable: true
        id:
          type: string
          format: uri
          nullable: true
        is_based_on:
          type: string
          format: uri
          nullable: true
        limit:
          type: integer
          format: int32
        mode:
          type: string
          nullable: true
        offset:
          type: integer
          format: int32
        publicationStatus:
          type: string
          nullable: true
        q:
          type: string
          nullable: true
        resource_types:
          type: array
          items:
            type: string
        sort:
          type: array
          items:
            type: string
          nullable: true
        version:
          type: string
          nullable: true
    OpenViewFolderResponse:
      type: object
      additionalProperties: false
      description: |
        One page of an anonymously readable folder. Opening a folder makes the full subtree below
        it public through OpenView. The response is caller-independent and contains only public
        child summaries, ancestor names, and normalized paging metadata.
      properties:
        '@context':
          type: object
          additionalProperties:
            type: string
        currentOffset:
          type: integer
          format: int64
        nodeListQueryType:
          type: string
        paging:
          type: object
          additionalProperties:
            type: string
            format: uri
        pathInfo:
          type: array
          items:
            $ref: "#/components/schemas/OpenViewPathSegment"
        request:
          $ref: "#/components/schemas/NodeListRequest"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/OpenViewResourceSummary"
        totalCount:
          type: integer
          format: int64
      required:
      - '@context'
      - currentOffset
      - nodeListQueryType
      - pathInfo
      - request
      - resources
      - totalCount
    OpenViewPathSegment:
      type: object
      additionalProperties: false
      description: |
        One breadcrumb segment. Ancestor names are public when a folder is open, but ancestor
        identifiers and all other graph properties are not.
      properties:
        schema:name:
          type: string
          nullable: true
      required:
      - schema:name
    OpenViewResourceSummary:
      type: object
      additionalProperties: false
      description: |
        The complete public summary of one direct child of an open folder. OpenView intentionally
        excludes ACLs, caller-specific permissions, provenance, timestamps, DOI data, and all other
        stored graph properties.
      properties:
        '@id':
          type: string
          format: uri
        resourceType:
          type: string
          enum:
          - folder
          - field
          - element
          - template
          - instance
        schema:name:
          type: string
          nullable: true
      required:
      - '@id'
      - resourceType
      - schema:name
    SchemaArtifactDocument:
      type: object
      additionalProperties: true
      description: "A template, template element or template field. Beyond the common\
        \ artifact keys it carries the model's versioning keys and the JSON Schema\
        \ keys that declare the properties an instance may hold. The entries under\
        \ `properties` depend on the artifact."
      properties:
        $schema:
          type: string
          format: uri
          description: The JSON Schema dialect IRI.
        '@context':
          type: object
          additionalProperties: true
          description: JSON-LD context for the keys the artifact uses.
        '@id':
          type: string
          format: uri
          description: "The artifact's IRI. The server mints it on a POST, so a body\
            \ sent to POST carries none; a body sent to PUT carries the IRI of the\
            \ path."
        '@type':
          type: string
          format: uri
          description: IRI of the artifact kind.
          enum:
          - https://schema.metadatacenter.org/core/Template
          - https://schema.metadatacenter.org/core/TemplateElement
          - https://schema.metadatacenter.org/core/TemplateField
          - https://schema.metadatacenter.org/core/StaticTemplateField
        _ui:
          type: object
          additionalProperties: true
          description: "Editor rendering directives: child order, labels, descriptions\
            \ and, for a field, its input type."
        bibo:status:
          type: string
          description: Publication status. A published artifact can no longer be changed.
          enum:
          - bibo:draft
          - bibo:published
        description:
          type: string
          description: "JSON Schema description, derived from the name."
        oslc:modifiedBy:
          type: string
          format: uri
          description: IRI of the user who last changed it.
        pav:createdBy:
          type: string
          format: uri
          description: IRI of the user who created it.
        pav:createdOn:
          type: string
          format: date-time
          description: When the artifact was created.
        pav:derivedFrom:
          type: string
          format: uri
          description: "IRI of the artifact this one was copied from, when there is\
            \ one."
          nullable: true
        pav:lastUpdatedOn:
          type: string
          format: date-time
          description: When the artifact was last changed.
        pav:previousVersion:
          type: string
          format: uri
          description: "IRI of the version this one was drafted from, when there is\
            \ one."
          nullable: true
        pav:version:
          type: string
          description: The artifact's own version.
        properties:
          type: object
          additionalProperties: true
          description: "One entry per child field or element, keyed by its name, plus\
            \ the JSON-LD keys an instance must carry."
        required:
          type: array
          description: Names of the properties an instance must carry.
          items:
            type: string
            description: Names of the properties an instance must carry.
        schema:description:
          type: string
